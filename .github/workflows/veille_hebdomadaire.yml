
name: Veille hebdomadaire Radar CHR

on:
  schedule:
    # Chaque lundi à 05:30 UTC, soit 06:30/07:30 en France selon la saison.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-chr-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la veille hebdomadaire
        run: python scripts/update_weekly.py

      - name: Vérifier les changements
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit automatique
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "radar-chr-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "data: veille CHR hebdomadaire"
          git push
